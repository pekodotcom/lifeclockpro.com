    <style>
        /* CSS Variables & Theming */
        :root {
            --bg-color: #ffffff;
            --text-color: #1a1a1a;
            --text-muted: #666666;
            --accent-blue: #0056b3; /* Royal Blue */
            --accent-hover: #004494;
            --card-bg: #f8f9fa;
            --border-color: #e0e0e0;
            --ad-bg: #f1f3f5;
            --font-primary: 'Inter', 'Hind Siliguri', sans-serif;
            --header-bg: rgba(255, 255, 255, 0.95);
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --text-color: #f5f5f5;
            --text-muted: #a0a0a0;
            --accent-blue: #3b82f6; /* Lighter blue for dark mode */
            --accent-hover: #60a5fa;
            --card-bg: #1e1e1e;
            --border-color: #333333;
            --ad-bg: #2a2a2a;
            --header-bg: rgba(18, 18, 18, 0.95);
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
        }

        /* Reset & Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        /* Custom Focus Ring to avoid default browser outline */
        *:focus-visible {
            outline: 2px solid var(--accent-blue);
            outline-offset: 2px;
        }

        /* সব ধরণের ব্রাউজার (Chrome, Safari, Edge, Firefox) থেকে স্ক্রলবার গায়েব করার সিএসএস */
        html {
            scrollbar-width: none; /* Firefox-এর জন্য স্ক্রলবার হাইড */
            -ms-overflow-style: none; /* IE এবং قدیمی Edge-এর জন্য */
        }

        html::-webkit-scrollbar {
            display: none; /* Chrome, Safari, Opera এবং নতুন Edge-এর জন্য স্ক্রলবার সম্পূর্ণ গায়েব */
        }

        body {
            font-family: var(--font-primary);
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            transition: background-color 0.3s ease, color 0.3s ease;
            overflow-x: hidden;
            scrollbar-width: none; /* বডির সেফটি ব্যাকআপ */
        }

        body::-webkit-scrollbar {
            display: none;
        }
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border-width: 0;
        }

        a {
            color: var(--accent-blue);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        a:hover {
            color: var(--accent-hover);
        }

        /* Typography using clamp() */
        h1 { font-size: clamp(1.5rem, 4vw, 2.5rem); font-weight: 700; }
        h2 { font-size: clamp(1.25rem, 3vw, 2rem); font-weight: 600; margin-bottom: 1rem; }
        p { font-size: clamp(1rem, 1.5vw, 1.125rem); margin-bottom: 1rem; }

        /* Header & Navigation */
        header {
    position: fixed;
    left: 0;
    width: 100%;
    top: 0;
    z-index: 1000;
            background-color: var(--header-bg);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent-blue);
        }

        .controls {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        button {
            background-color: var(--accent-blue);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
            font-weight: 600;
            transition: background-color 0.3s ease, transform 0.1s ease;
        }

        button:hover { background-color: var(--accent-hover); }
        button:active { transform: scale(0.98); }

        .btn-outline {
            background-color: transparent;
            color: var(--accent-blue);
            border: 2px solid var(--accent-blue);
        }
        .btn-outline:hover {
            background-color: var(--accent-blue);
            color: white;
        }

        /* Layout (CSS Grid Expanded for Maximized Readability & Ad Placement) */
        .container {
    width: 100%;
    max-width: 1600px;
    margin: 70px auto 0 auto;
            padding: 2rem 2%;
            display: grid;
            grid-template-columns: 300px 1fr 300px; /* দুই পাশের বিজ্ঞাপন স্লটের জন্য সমান ও বড় ৩00px স্পেস */
            gap: 2.5rem;
        }

        /* Advertisement Slots */
        .ad-slot {
            background-color: var(--ad-bg);
            border: 1px dashed var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            text-align: center;
            border-radius: 8px;
            padding: 1rem;
            min-height: 100px;
        }

        /* প্রফেশনাল বিজ্ঞাপনের জন্য স্লটের সাইজ বৃদ্ধি ও অপ্টিমাইজেশন */
        .ad-skyscraper {
            width: 300px;
            height: 600px; /* আন্তর্জাতিক স্ট্যান্ডার্ড হাফ-পেজ অ্যাড সাইজ */
            position: sticky;
            top: 100px;
        }
        .ad-banner {
            width: 100%;
            min-height: 250px; /* লার্জ লিডারবোর্ড ৯৭০x২৫০ সাইজ, যা সর্বোচ্চ ডলার ইনকাম নিশ্চিত করে */
            margin-bottom: 2rem;
        }

        /* Main Content with Fixed Top Banner Grid & Enhanced Typography */
        .content {
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }
        /* টপ ব্যানারকে সবসময় কলামের প্রথমে রাখার জন্য সিএসএস রুল */
        .ad-banner {
            order: -1 !important;
        }
        .content h2 {
            font-size: clamp(1.4rem, 2.5vw, 2.2rem) !important;
            line-height: 1.4;
            margin-bottom: 1rem;
        }
        .content p {
            font-size: clamp(1.05rem, 1.6vw, 1.2rem) !important;
            line-height: 1.7;
        }

        /* Article Cards (Spacing & Hover Animation Depth Fixed) */
        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            margin-bottom: 2rem; /* লুপ কন্টেইনারের ভেতর কার্ডগুলোর মধ্যকার নিখুঁত দূরত্ব */
            position: relative;
            z-index: 1;
        }

        .card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 20px -5px rgba(0, 0, 0, 0.15);
            z-index: 2; /* অ্যানিমেশনের সময় কার্ডটি যাতে পেছনের কার্ডের ওপরে ভেসে ওঠে */
        }

        .card-img-wrapper {
            width: 100%;
            height: 250px;
            overflow: hidden;
        }

        .card-img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .card:hover .card-img-wrapper img {
            transform: scale(1.05);
        }

        .card-body { padding: 1.5rem; word-break: break-word; overflow-wrap: break-word; }
        .card-meta { color: var(--text-muted); font-size: 0.875rem; margin-bottom: 0.5rem; }

        /* Right Sidebar */
        .right-sidebar {
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .widget {
            background-color: var(--card-bg);
            padding: 1.5rem;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .widget ul { list-style: none; }
        .widget ul li { margin-bottom: 0.75rem; }
        .widget ul li a { color: var(--text-color); }
        .widget ul li a:hover { color: var(--accent-blue); }

        /* Footer */
        footer {
            background-color: var(--card-bg);
            border-top: 1px solid var(--border-color);
            padding: 3rem 5%;
            margin-top: 4rem;
            text-align: center;
        }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 2rem;
            flex-wrap: wrap;
            margin-bottom: 1.5rem;
        }

        /* Responsive Design & Mobile Anchor Ad Smart Routing (No Layout Breaking) */
        @media (max-width: 1024px) {
            .container { grid-template-columns: 1fr 300px; gap: 1.5rem; }
            .left-sidebar { display: none; }
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
                padding: 1rem 4%;
            }
            .right-sidebar { grid-row: 3; }

            /* মোবাইল ডিভাইসে টপ ব্যানার ফিক্সড রাখার মেকানিজম */
            .ad-banner {
                position: sticky;
                top: 70px;
                z-index: 999;
                background-color: var(--card-bg);
                box-shadow: var(--shadow);
                margin-bottom: 1.5rem;
            }

            /* ইন-আর্টিকেল অ্যাডগুলোকে মোবাইলের স্ক্রিন রেশিও অনুযায়ী ফিট করা */
            .ad-slot {
                min-height: 80px !important;
                font-size: 0.85rem;
            }
        }

        /* --- ডেস্কটপ ও ল্যাপটপে প্রিমিয়াম ফ্লুইড ১-লাইন বিন্যাস লক রাখার সিএসএস --- */
        header {
            padding: 0.5rem 5% !important; /* হেডার বার চিকন করার জন্য প্যাডিং কমানো হলো */
        }
        .blog-custom-header {
            display: flex !important;
            flex-direction: row !important;
            justify-content: space-between !important;
            align-items: center !important;
            gap: 1.5rem !important;
        }
        .header-top-row {
            display: flex !important;
            align-items: center !important;
            justify-content: space-between !important;
            flex-grow: 1 !important;
        }
        .header-nav-actions {
            display: flex !important;
            gap: 1.25rem !important;
            align-items: center !important;
            margin-left: auto !important; /* হোম এবং ক্যাটাগরি একদম ডান পাশে সরিয়ে নেওয়ার জন্য */
            padding-right: 1rem;
        }
        /* বাটনগুলোর চারপাশের নীল বক্স বা বর্ডার রিমুভ এবং ফন্ট সাইজ ১০০% সমান করার সিএসএস */
        .btn-outline.nav-home-btn, .category-custom-btn, #langToggle, #themeToggle {
            border: none !important;
            background: transparent !important;
            color: var(--text-color) !important;
            padding: 0.4rem 0.5rem !important; /* মোবাইলের জন্য প্যাডিং আরো নিখুঁত করা হলো */
            font-size: 0.95rem !important;
            font-weight: 600 !important;
            font-family: var(--font-primary) !important;
            cursor: pointer !important;
            display: inline-flex !important;
            align-items: center !important;
            justify-content: center !important;
            gap: 4px !important;
            line-height: 1 !important;
            transition: color 0.3s, background 0.3s;
            flex-shrink: 0 !important; /* ভাষা পরিবর্তনের সময় যেন বাটন ছোট হয়ে ভেঙে না যায় */
        }
        .btn-outline.nav-home-btn:hover, .category-custom-btn:hover, #langToggle:hover, #themeToggle:hover {
            color: var(--accent-blue) !important;
            background: transparent !important;
        }
        /* কাস্টম অ্যানিমেটেড ড্রপডাউন কন্টেইনার */
        .category-select-container {
            position: relative;
            display: inline-block;
            flex-shrink: 0 !important;
        }
        .category-custom-btn i {
            font-size: 0.8rem;
            transition: transform 0.3s ease;
        }
        /* ড্রপডাউন লিস্টের স্মুথ অ্যানিমেশন সিএসএস */
        .custom-dropdown-menu {
            position: absolute;
            top: 110%;
            left: 0;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            min-width: 160px;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: opacity 0.3s ease, transform 0.3s ease, visibility 0.3s ease;
            overflow: hidden;
            padding: 0.4rem 0;
        }
        .custom-dropdown-menu.show {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }
        .custom-dropdown-item {
            width: 100%;
            padding: 0.6rem 1.2rem;
            text-align: left;
            background: transparent;
            border: none;
            color: var(--text-color);
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
            display: block;
        }
        .custom-dropdown-item:hover {
            background: rgba(0, 86, 179, 0.08);
            color: var(--accent-blue);
        }

        #themeToggle {
            background: transparent !important;
            color: var(--text-color) !important;
            font-size: 1.1rem !important;
        }
        .header-bottom-row {
            position: relative !important;
            display: flex !important;
            align-items: center !important;
            max-width: 260px !important;
            width: 100% !important;
        }
        .header-bottom-row input {
            padding: 0.5rem 1rem !important;
            padding-right: 2.5rem !important;
            border-radius: 30px !important; /* উভয় ডিভাইসের জন্য প্রিমিয়াম রাউন্ডেড কোণ */
            border: 1px solid var(--border-color) !important;
            background: var(--card-bg) !important;
            color: var(--text-color) !important;
            font-size: 0.9rem !important;
            width: 100% !important;
            font-family: inherit !important;
            transition: all 0.3s ease !important;
        }
        /* ক্লিক বা ফোকাস করলে সলিড নীল স্ট্রোক থাকবে না, শুধু হালকা প্রিমিয়াম শ্যাডো থাকবে */
        .header-bottom-row input:focus {
            outline: none !important;
            border-color: var(--border-color) !important; /* নীল স্ট্রোক বা বর্ডার রিমুভ */
            box-shadow: 0 4px 15px rgba(0, 86, 179, 0.15) !important; /* হালকা নীল গ্লো শ্যাডো */
        }
        .search-icon-marker {
            position: absolute !important;
            left: 15px !important; /* আইকনকে একদম বাম পাশে গুগলের মতো সেট করা হলো */
            color: var(--text-muted) !important;
            pointer-events: none !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            z-index: 2 !important;
        }
        /* সার্চ বক্সের ভেতরের টেক্সট প্যাডিং বাম পাশে বাড়িয়ে দেওয়া হলো যাতে আইকনের ওপর লেখা না চলে আসে */
        .header-bottom-row input {
            padding: 0.5rem 1rem !important;
            padding-left: 2.6rem !important; /* বাম পাশের আইকনের জন্য পারফেক্ট সেফ গ্যাপ */
            border-radius: 30px !important;
            border: 1px solid var(--border-color) !important;
            background: var(--card-bg) !important;
            color: var(--text-color) !important;
            font-size: 0.9rem !important;
            width: 100% !important;
            font-family: inherit !important;
            transition: all 0.3s ease !important;
        }

       /* --- শুধুমাত্র মোবাইল এবং ট্যাব স্ক্রিনের জন্য আল্ট্রা-ফিট স্লিম রেসপনসিভ মেকানিজম --- */
        @media (max-width: 768px) {
    header {
        padding: 0.4rem 4% !important;
        position: fixed !important;
        left: 0 !important;
        width: 100% !important;
                top: 0 !important;
                z-index: 1010 !important;
                height: 48px !important; /* মোড পরিবর্তন ও লোডিং ফ্রেশ রাখার জন্য ফিক্সড স্লিম হাইট */
                overflow: visible !important;
            }
            .blog-custom-header {
                display: flex !important;
                flex-direction: row !important; /* ১-লাইনে আল্ট্রা স্লিম লেআউট */
                justify-content: space-between !important;
                align-items: center !important;
                gap: 0.5rem !important;
                width: 100% !important;
                position: relative !important;
            }
            .header-top-row {
                width: 100% !important;
                display: flex !important;
                justify-content: space-between !important;
                align-items: center !important;
            }
            .logo {
                font-size: 1.25rem !important;
                flex-shrink: 0 !important;
            }
            .header-nav-actions {
                display: flex !important;
                align-items: center !important;
                justify-content: flex-end !important;
                gap: 0.15rem !important;
                flex-wrap: nowrap !important;
                padding-right: 0 !important;
                margin-right: -4px !important;
            }

    <script>
        document.addEventListener('DOMContentLoaded', () => {

            // --- XSS Sanitization Helper ---
            // A basic utility to escape HTML inputs if you render dynamic data
            window.sanitizeHTML = (str) => {
                const temp = document.createElement('div');
                temp.textContent = str;
                return temp.innerHTML;
            };

            // --- Theme Management (Dark/Light) ---
            const themeToggleBtn = document.getElementById('themeToggle');
            const htmlTag = document.documentElement;

            // Check local storage or system preference
            const savedTheme = localStorage.getItem('theme');
            const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

            let currentTheme = savedTheme || (systemPrefersDark ? 'dark' : 'light');

            const updateThemeUI = () => {
                htmlTag.setAttribute('data-theme', currentTheme);
                // ক্লিক করার পর রিয়েল ভেক্টর আইকন লোড হবে যা একদম মিডলে অ্যালাইন থাকবে
                themeToggleBtn.innerHTML = currentTheme === 'dark' ? '<i class="fa-solid fa-sun"></i>' : '<i class="fa-solid fa-moon"></i>';
            };

            // Initialize Theme
            updateThemeUI();

            themeToggleBtn.addEventListener('click', () => {
                currentTheme = currentTheme === 'light' ? 'dark' : 'light';
                localStorage.setItem('theme', currentTheme);
                updateThemeUI();
            });

            // --- Language Switcher (BN/EN) ---
            const langToggleBtn = document.getElementById('langToggle');
            let currentLang = 'bn'; // Default language

            const updateLanguageUI = () => {
                const textElements = document.querySelectorAll('.lang-text');
                textElements.forEach(el => {
                    // Update text content safely
                    el.innerHTML = sanitizeHTML(el.getAttribute(`data-${currentLang}`));
                });
                langToggleBtn.innerHTML = `<i class="fa-solid fa-globe" style="font-size: 1.1rem;"></i>`;
                htmlTag.setAttribute('lang', currentLang);
            };

            langToggleBtn.addEventListener('click', () => {
                currentLang = currentLang === 'bn' ? 'en' : 'bn';
                // ফেইল-সেফ চেক: শুধু যে এলিমেন্টগুলোর রিয়েল ডেটা আছে, সেগুলোর ল্যাঙ্গুয়েজ আপডেট হবে
                const textElements = document.querySelectorAll('.lang-text');
                textElements.forEach(el => {
                    const attrData = el.getAttribute(`data-${currentLang}`);
                    if (attrData && attrData !== 'null') {
                        el.innerHTML = sanitizeHTML(attrData);
                    }
                });
                // আইকন পজিশনিং যাতে ফিক্সড থাকে
                langToggleBtn.innerHTML = `<i class="fa-solid fa-globe" style="font-size: 0.95rem;"></i>`;
                htmlTag.setAttribute('lang', currentLang);
            });

        });
        </script>




        <script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getFirestore, collection, getDocs, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC6AP7nKf7d720T0IEl7LRcLeVaak2a4s0",
  authDomain: "knowlify-com.firebaseapp.com",
  projectId: "knowlify-com",
  storageBucket: "knowlify-com.firebasestorage.app",
  messagingSenderId: "724166469100",
  appId: "1:724166469100:web:0c136db1ad1e6c6bf00cc9",
  measurementId: "G-KMQBBQGE6F"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// ইউজার প্যানেলের জন্য নতুন পোস্ট সবার উপরে সাজানো
const articlesQuery = query(collection(db, "articles"), orderBy("timestamp", "desc"), limit(20));
const querySnapshot = await getDocs(articlesQuery);

const container = document.getElementById("articlesContainer");
window.allFetchedArticles = [];

// ব্যানার পজিশন সেফটি চ্যানেল ইন্টিগ্রেশন
const topBannerElement = document.getElementById('topPremiumBanner');
const contentWrapper = document.querySelector('.content');
if (topBannerElement && contentWrapper) {
    contentWrapper.insertBefore(topBannerElement, container);
}

querySnapshot.forEach((doc) => {
    const post = doc.data();

    // ছবি না থাকলে সম্পূর্ণ ফাকা রাখার কন্ডিশনাল ট্র্যাকিং (পার্মানেন্ট ফিক্স)
    let postImageUrl = "";
    let hasImage = false;

    if (post.images && post.images.length > 0 && post.images[0] && post.images[0] !== "" && !post.images[0].includes("undefined")) {
        let rawUrl = post.images[0].trim();

        // --- গুগল ড্রাইভ ডাইরেক্ট লিংক অটো-কনভার্টার ইঞ্জিন ---
        // ইউজার গুগল ড্রাইভের যে লিংকই বসাক না কেন, কোড নিজে থেকেই আইডি (ID) বের করে ডাইরেক্ট ইমেজ লিংক বানিয়ে নেবে
        if (rawUrl.includes("drive.google.com")) {
            const driveIdMatch = rawUrl.match(/\/d\/([^/]+)/) || rawUrl.match(/id=([^&]+)/);
            if (driveIdMatch && driveIdMatch[1]) {
                postImageUrl = `https://drive.google.com/uc?export=view&id=${driveIdMatch[1]}`;
            } else {
                postImageUrl = rawUrl;
            }
        } else {
            postImageUrl = rawUrl; // গুগল ড্রাইভ না হয়ে সাধারণ Base64 বা অন্য লিংক হলে স্বাভাবিক থাকবে
        }

        hasImage = true;
    }

    window.allFetchedArticles.push({
        id: doc.id,
        category: post.category || "General",
        titleBn: post.title?.bn || post.title || "শিরোনামহীন",
        content: post.content || "",
        imageUrl: postImageUrl,
        hasImage: hasImage
    });
});

// ডাইনামিক রেন্ডারিং ইঞ্জিন (সার্চ এবং ফিল্টারের জন্য)
const renderFilteredArticles = (articlesArray) => {
    container.innerHTML = "";
    if (articlesArray.length === 0) {
        container.innerHTML = `<div style="text-align:center; padding:3rem; color:var(--text-muted); font-weight:600;">কোনো পোস্ট পাওয়া যায়নি!</div>`;
        return;
    }
    articlesArray.forEach(post => {
        // জাভাস্ক্রিপ্ট টগল করার জন্য একটি ইউনিক সেফ আইডি তৈরি
        const uniqueId = `content_${post.id}`;

        container.innerHTML += `
        <article class="card" data-category="${post.category}">
            ${post.hasImage && post.imageUrl !== "" ? `
            <div class="card-img-wrapper" style="width: 100%; height: 250px; overflow: hidden;">
                <img src="${encodeURI(post.imageUrl)}" style="width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease;" alt="${window.sanitizeHTML(post.titleBn)}" loading="lazy">
            </div>` : ''}
            <div class="card-body">
                <div class="card-meta" style="color: var(--text-muted); font-size: 0.875rem; margin-bottom: 0.5rem; font-weight: 600; color: var(--accent-blue);">
                    📌 ${window.sanitizeHTML(post.category)}
                </div>
                <h2>${window.sanitizeHTML(post.titleBn || "শিরোনামহীন")}</h2>

                <div id="${uniqueId}" style="max-height: 4.8em; overflow: hidden; transition: max-height 0.5s cubic-bezier(0, 1, 0, 1); color: var(--text-muted); font-size: 1rem; line-height: 1.6;">
                    ${window.sanitizeHTML(post.content)}
                </div>

                <button onclick="window.toggleArticleReadMore('${uniqueId}', this)" style="background: transparent; color: var(--accent-blue); padding: 0; margin-top: 0.75rem; border: none; font-weight: 600; display: inline-flex; align-items: center; cursor: pointer; font-size: 0.95rem; box-shadow: none; transform: none;">
                    আরও পড়ুন <i class="fa-solid fa-arrow-down" style="margin-left: 5px; font-size: 0.8rem;"></i>
                </button>
            </div>
        </article>
        `;
    });
};

// একটি গ্লোবাল ভ্যারিয়েবল দিয়ে বর্তমান সিলেক্টেড ক্যাটাগরি ট্র্যাক করা (পুরনো নাল আইডি ফিক্স)
window.currentActiveCategory = 'all';

// ১. গ্লোবাল ক্যাটাগরি ফিল্টার ফাংশন (১০০% ফিক্সড)
window.filterCategory = function(categoryName) {
    document.getElementById('searchInput').value = ""; // সার্চ ক্লিয়ার করা
    window.currentActiveCategory = categoryName; // সিলেক্টেড ক্যাটাগরি সেভ রাখা

    if (categoryName === 'all') {
        renderFilteredArticles(window.allFetchedArticles);
    } else {
        const filtered = window.allFetchedArticles.filter(a => a.category === categoryName);
        renderFilteredArticles(filtered);
    }
};

// ২. গ্লোবাল লাইভ সার্চ ফাংশন (১০০% ফিক্সড)
window.liveSearch = function(searchQuery) {
    const queryText = searchQuery.toLowerCase().trim();
    const activeCategory = window.currentActiveCategory; // গ্লোবাল ভ্যারিয়েবল থেকে ডেটা নেওয়া হলো

    let baseArticles = window.allFetchedArticles;
    if (activeCategory !== 'all') {
        baseArticles = window.allFetchedArticles.filter(a => a.category === activeCategory);
    }

    if (queryText === "") {
        renderFilteredArticles(baseArticles);
        return;
    }

    const filtered = baseArticles.filter(a =>
        a.titleBn.toLowerCase().includes(queryText) ||
        a.content.toLowerCase().includes(queryText)
    );
    renderFilteredArticles(filtered);
};

// ইনিশিয়াল রেন্ডার রান করা
renderFilteredArticles(window.allFetchedArticles);

// --- কাস্টম ক্যাটাগরি ড্রপডাউন কন্ট্রোল ফাংশন ---
window.toggleCategoryDropdown = function(event) {
    event.stopPropagation();
    const dropdown = document.getElementById('customDropdown');
    const icon = document.querySelector('.category-custom-btn i');

    // টগল ক্লাস (অ্যানিমেশন চালু/বন্ধ করা)
    dropdown.classList.toggle('show');

    // আইকন ঘোরানো (Chevron Rotate Animation)
    if (dropdown.classList.contains('show')) {
        icon.style.transform = 'rotate(180deg)';
    } else {
        icon.style.transform = 'rotate(0deg)';
    }
};

window.selectCategory = function(categoryValue) {
    // বর্তমান ফিল্টারিং ফাংশন কল করা (বিন্দুমাত্র কোড নষ্ট না করে)
    if (typeof window.filterCategory === 'function') {
        window.filterCategory(categoryValue);
    }

    // সিলেক্ট করার পর ড্রপডাউন বন্ধ করা
    const dropdown = document.getElementById('customDropdown');
    const icon = document.querySelector('.category-custom-btn i');
    dropdown.classList.remove('show');
    icon.style.transform = 'rotate(0deg)';
};

// ড্রপডাউনের বাইরে ক্লিক করলে স্বয়ংক্রিয়ভাবে বন্ধ হওয়ার লজিক
document.addEventListener('click', function(event) {
    const dropdown = document.getElementById('customDropdown');
    const icon = document.querySelector('.category-custom-btn i');
    if (dropdown && dropdown.classList.contains('show')) {
        dropdown.classList.remove('show');
        if (icon) icon.style.transform = 'rotate(0deg)';
    }
});

// --- মোবাইলের জন্য পিওর অ্যানিমেটেড সার্চ ইঞ্জিন কন্ট্রোল ---
window.toggleMobileSearch = function(event) {
    if (event) event.stopPropagation();
    const searchBar = document.querySelector('.header-bottom-row');
    const searchInput = document.getElementById('searchInput');

    if (searchBar) {
        searchBar.classList.toggle('active');
        // ওপেন হওয়ার সাথে সাথে ইনপুট ফিল্ড ফোকাস হবে
        if (searchBar.classList.contains('active') && searchInput) {
            setTimeout(() => { searchInput.focus(); }, 100);
        }
    }
};

// ১. বাইরে ক্লিক করলে অথবা ২. স্ক্রল ডাউন শুরু করলেই সার্চবার স্মুথলি হাইড হয়ে যাওয়ার লজিক
document.addEventListener('click', function(event) {
    const searchBar = document.querySelector('.header-bottom-row');
    const trigger = document.querySelector('.mobile-search-trigger');

    if (searchBar && searchBar.classList.contains('active')) {
        if (!searchBar.contains(event.target) && !trigger.contains(event.target)) {
            searchBar.classList.remove('active');
        }
    }
});

window.addEventListener('scroll', function() {
    const searchBar = document.querySelector('.header-bottom-row');
    if (searchBar && searchBar.classList.contains('active')) {
        // স্ক্রল করলেই কোনো এরর ছাড়া স্মুথলি ক্লোজ হবে
        searchBar.classList.remove('active');
    }
}, { passive: true });

// ৩. প্রিমিয়াম স্মুথ স্লাইড-ডাউন এবং বাটন টেক্সট এক্সচেঞ্জ মেথড
window.toggleArticleReadMore = function(elementId, buttonElement) {
    const targetBox = document.getElementById(elementId);
    if (!targetBox) return;

    // চেক করা হচ্ছে কন্টেন্ট বক্সটি কি বর্তমানে বন্ধ আছে নাকি খোলা
    if (targetBox.style.maxHeight === "4.8em" || targetBox.style.maxHeight === "") {
        // মসৃণভাবে নিচের দিকে পুরো লেখাটি ওপেন হবে
        targetBox.style.transition = "max-height 0.6s cubic-bezier(0.4, 0, 0.2, 1)";
        targetBox.style.maxHeight = "2000px"; // বড় কন্টেন্টের জন্য সর্বোচ্চ লিমিট লক করা হলো

        // বাটন টেক্সট ও আইকন পরিবর্তন
        buttonElement.innerHTML = `সংক্ষিপ্ত করুন <i class="fa-solid fa-arrow-up" style="margin-left: 5px; font-size: 0.8rem;"></i>`;
    } else {
        // মসৃণভাবে আবার ৩ লাইনে সংকুচিত হয়ে যাবে
        targetBox.style.transition = "max-height 0.4s ease-out";
        targetBox.style.maxHeight = "4.8em";

        // বাটন টেক্সট আগের অবস্থায় ফিরিয়ে নেওয়া
        buttonElement.innerHTML = `আরও পড়ুন <i class="fa-solid fa-arrow-down" style="margin-left: 5px; font-size: 0.8rem;"></i>`;

        // ইউজার স্ক্রিন যাতে হারিয়ে না যায়, তাই স্মুথলি কার্ডের শুরুতে স্ক্রল ব্যাক করানো
        targetBox.closest('.card').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }
};
</script>
</body>
</html>
